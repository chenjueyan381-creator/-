<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
<meta name="theme-color" content="#080808" />
<title>我的小世界</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Noto+Serif+SC:wght@400;500;700&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ===================== 星空 / 魔法阵背景 ===================== -->
  <div class="bg-layer">
    <canvas id="starfield"></canvas>
    <div class="magic-circle magic-circle--one"></div>
    <div class="magic-circle magic-circle--two"></div>
    <div class="vignette"></div>
  </div>

  <!-- ===================== 密码入口页 ===================== -->
  <section id="gate" class="gate">
    <div class="gate__rune"></div>
    <div class="gate__inner">
      <p id="typewriter" class="gate__typewriter"></p>
      <form id="gate-form" class="gate__form" autocomplete="off">
        <label class="gate__label" for="gate-input">输入通行密语</label>
        <div class="gate__field">
          <input id="gate-input" class="gate__input" type="password" inputmode="numeric" placeholder="· · · · · ·" />
          <button id="gate-submit" class="gate__btn" type="submit">进入</button>
        </div>
        <p id="gate-error" class="gate__error"></p>
      </form>
    </div>
  </section>

  <!-- ===================== 主站 ===================== -->
  <main id="app" class="app" hidden>
    <header class="topbar">
      <h1 class="topbar__title">我 的 小 世 界</h1>
      <nav class="nav">
        <button class="nav__item is-active" data-section="characters">角色收藏馆</button>
        <button class="nav__item" data-section="diary">秘密日记</button>
        <button class="nav__item" data-section="favorites">我喜欢的</button>
        <button class="nav__item" data-section="mood">今日心情</button>
        <button class="nav__item" data-section="about">关于这里</button>
      </nav>
    </header>

    <!-- ---------- 角色收藏馆 ---------- -->
    <section id="characters" class="panel is-active">
      <div class="section-head">
        <h2 class="section-title">角色收藏馆</h2>
        <p class="section-sub">收藏于心底的那些灵魂</p>
      </div>
      <div id="card-grid" class="card-grid"><!-- JS 注入 --></div>
    </section>

    <!-- ---------- 秘密日记 ---------- -->
    <section id="diary" class="panel">
      <div class="section-head">
        <h2 class="section-title">秘密日记</h2>
        <p class="section-sub">CLASSIFIED · 仅本人可阅</p>
      </div>
      <div class="diary">
        <form id="diary-form" class="diary__editor">
          <div class="diary__stamp">绝密档案</div>
          <input id="diary-date" class="diary__date" type="date" />
          <textarea id="diary-text" class="diary__text" rows="6" placeholder="在此记录今日不可示人的心绪……"></textarea>
          <div class="diary__actions">
            <button type="submit" class="btn btn--seal">封存此页</button>
          </div>
        </form>
        <div id="diary-list" class="diary__list"><!-- JS 注入 --></div>
      </div>
    </section>

    <!-- ---------- 我喜欢的 ---------- -->
    <section id="favorites" class="panel">
      <div class="section-head">
        <h2 class="section-title">我喜欢的</h2>
        <p class="section-sub">那些让我心动的存在</p>
      </div>
      <div class="fav">
        <form id="fav-form" class="fav__form">
          <select id="fav-type" class="fav__select">
            <option value="music">🎵 音乐</option>
            <option value="movie">🎬 影视</option>
            <option value="thing">✨ 东西</option>
          </select>
          <input id="fav-input" class="fav__input" type="text" placeholder="添加一个喜欢的……" />
          <button type="submit" class="btn">收藏</button>
        </form>
        <div class="fav__columns">
          <div class="fav__col" data-type="music"><h3>🎵 音乐</h3><ul id="fav-music" class="fav__list"></ul></div>
          <div class="fav__col" data-type="movie"><h3>🎬 影视</h3><ul id="fav-movie" class="fav__list"></ul></div>
          <div class="fav__col" data-type="thing"><h3>✨ 东西</h3><ul id="fav-thing" class="fav__list"></ul></div>
        </div>
      </div>
    </section>

    <!-- ---------- 今日心情 ---------- -->
    <section id="mood" class="panel">
      <div class="section-head">
        <h2 class="section-title">今日心情</h2>
        <p class="section-sub">用草莓丈量今天的甜度</p>
      </div>
      <div class="mood">
        <div class="mood__today">
          <div class="mood__date" id="mood-today-date"></div>
          <div id="mood-stars" class="mood__stars" role="radiogroup" aria-label="今日草莓评分">
            <button class="mood__berry" data-v="1">🍓</button>
            <button class="mood__berry" data-v="2">🍓</button>
            <button class="mood__berry" data-v="3">🍓</button>
            <button class="mood__berry" data-v="4">🍓</button>
            <button class="mood__berry" data-v="5">🍓</button>
          </div>
          <input id="mood-note" class="mood__note" type="text" placeholder="今天的一句话……" />
        </div>
        <div class="mood__history">
          <h3>心情轨迹</h3>
          <div id="mood-list" class="mood__list"></div>
        </div>
      </div>
    </section>

    <!-- ---------- 关于这里 ---------- -->
    <section id="about" class="panel">
      <div class="section-head">
        <h2 class="section-title">关于这里</h2>
        <p class="section-sub">这里只关于我自己</p>
      </div>
      <div class="about">
        <div class="about__sigil"></div>
        <p class="about__kao">( 𓂂 '꒳' ))`꒳' 𓂂)</p>
        <p class="about__grow">我会好好长大</p>
      </div>
    </section>

    <footer class="footer">⟡ 我的小世界 ⟡</footer>
  </main>

  <!-- ===================== 可拖动的小星球（B-612） ===================== -->
  <div id="planet" class="planet" hidden role="button" aria-label="拖动小星球" tabindex="0">
    <span class="planet__hint">拖我 ✦</span>
    <div class="planet__float">
      <svg viewBox="0 0 200 200" width="130" height="130" aria-hidden="true">
        <defs>
          <radialGradient id="sun" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#fff4c2" stop-opacity="0.9"/>
            <stop offset="45%" stop-color="#ffd86b" stop-opacity="0.45"/>
            <stop offset="100%" stop-color="#ffb347" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="globe" cx="38%" cy="32%" r="75%">
            <stop offset="0%" stop-color="#bff0a6"/>
            <stop offset="45%" stop-color="#74c98a"/>
            <stop offset="80%" stop-color="#3f9d77"/>
            <stop offset="100%" stop-color="#2b7d6a"/>
          </radialGradient>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#aee9ff"/>
            <stop offset="100%" stop-color="#7fd1f0"/>
          </linearGradient>
          <clipPath id="globeClip"><circle cx="100" cy="112" r="46"/></clipPath>
        </defs>

        <!-- 暖阳光晕 -->
        <circle cx="100" cy="100" r="98" fill="url(#sun)"/>

        <!-- 轨道与小月亮 -->
        <g class="planet__orbit">
          <ellipse cx="100" cy="112" rx="78" ry="30" fill="none" stroke="#ffe39a" stroke-opacity="0.5" stroke-width="1.4" stroke-dasharray="3 6"/>
          <circle class="planet__moon" cx="178" cy="112" r="6" fill="#ffd86b"/>
        </g>

        <!-- 星球本体 -->
        <circle cx="100" cy="112" r="46" fill="url(#globe)"/>
        <g clip-path="url(#globeClip)">
          <!-- 草地起伏 -->
          <path d="M54 130 Q72 116 92 128 T132 126 T150 134 L150 160 L54 160 Z" fill="#3f9d77" opacity="0.6"/>
          <ellipse cx="78" cy="138" rx="10" ry="4" fill="#2f8a64" opacity="0.5"/>
          <ellipse cx="120" cy="142" rx="13" ry="5" fill="#2f8a64" opacity="0.45"/>
          <!-- 小火山 + 烟 -->
          <path d="M70 132 L80 110 L90 132 Z" fill="#e98a5b"/>
          <path d="M76 110 q-4 -6 1 -11 q5 -4 1 -10" class="planet__smoke" fill="none" stroke="#fff" stroke-opacity="0.8" stroke-width="2.4" stroke-linecap="round"/>
          <!-- 高光 -->
          <ellipse cx="80" cy="92" rx="20" ry="12" fill="#ffffff" opacity="0.18"/>
        </g>

        <!-- 玫瑰（小王子的花） -->
        <g class="planet__rose" transform="translate(122 70)">
          <line x1="0" y1="0" x2="0" y2="-22" stroke="#3f9d77" stroke-width="2.4" stroke-linecap="round"/>
          <path d="M0 -10 q-9 -2 -10 -9 q9 1 10 9" fill="#5ab47f"/>
          <path d="M0 -14 q9 -2 10 -9 q-9 1 -10 9" fill="#5ab47f"/>
          <circle cx="0" cy="-26" r="7" fill="#ff7a9c"/>
          <circle cx="-3" cy="-27" r="3.4" fill="#ff5c84"/>
          <circle cx="3" cy="-25" r="3.2" fill="#ff97b3"/>
          <circle cx="0" cy="-26" r="1.8" fill="#ffd1dd"/>
        </g>

        <!-- 飞过的小鸟 -->
        <path class="planet__bird" d="M150 56 q5 -5 10 0 q5 -5 10 0" fill="none" stroke="#fff" stroke-opacity="0.85" stroke-width="2" stroke-linecap="round"/>
        <!-- 闪烁小星 -->
        <g fill="#fff6cf">
          <circle class="planet__tw" cx="42" cy="70" r="2"/>
          <circle class="planet__tw" cx="162" cy="150" r="1.8" style="animation-delay:.8s"/>
          <circle class="planet__tw" cx="58" cy="168" r="1.6" style="animation-delay:1.4s"/>
        </g>
      </svg>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
