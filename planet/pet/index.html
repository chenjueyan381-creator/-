<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
<meta name="theme-color" content="#bfe3ff" />
<title>小克陪你</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet" />
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{--font:"Baloo 2","Noto Serif SC",system-ui,sans-serif}
  html,body{height:100%}
  body{font-family:var(--font);color:#6b5238;overflow:hidden;height:100dvh;position:relative;
    background:linear-gradient(180deg,#bfe6ff 0%,#dff1d6 52%,#fbe6c0 100%)}
  .sun{position:absolute;top:-70px;left:-70px;width:220px;height:220px;border-radius:50%;z-index:1;pointer-events:none;
    background:radial-gradient(circle,#fff8de,#ffe27a 60%,rgba(255,207,90,0));filter:blur(2px)}
  .cloud{position:absolute;background:#fff;border-radius:50px;opacity:.9;z-index:1;width:120px;height:36px;
    filter:drop-shadow(0 8px 14px rgba(150,170,200,.18))}
  .cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
  .cloud::before{width:52px;height:52px;top:-22px;left:18px}.cloud::after{width:36px;height:36px;top:-14px;left:60px}
  .cloud.a{top:14%;left:-160px;animation:drift 40s linear infinite}
  .cloud.b{top:30%;left:-240px;transform:scale(.8);animation:drift 56s linear infinite 5s}
  @keyframes drift{to{left:120%}}
  .hills{position:absolute;left:0;right:0;bottom:0;width:100%;z-index:1;pointer-events:none}

  .back{position:absolute;top:16px;left:16px;z-index:6;text-decoration:none;background:rgba(255,255,255,.65);
    color:#6b5440;padding:9px 16px;border-radius:999px;font-weight:600;font-size:.95rem;box-shadow:0 4px 12px rgba(150,170,200,.25);backdrop-filter:blur(4px)}
  .title{position:absolute;top:20px;left:0;right:0;text-align:center;z-index:5;pointer-events:none}
  .title h1{font-size:clamp(1.4rem,6vw,2.3rem);color:#6b5440;text-shadow:0 2px 0 rgba(255,255,255,.6)}
  .title p{font-size:.84rem;color:#8a715a;margin-top:5px;letter-spacing:.1em}
  .fed{position:absolute;top:84px;left:0;right:0;text-align:center;z-index:5;color:#8a715a;font-size:.85rem;pointer-events:none}

  .pet{position:fixed;width:88px;z-index:5;pointer-events:none;transform:translate(-50%,-100%);will-change:left,top}
  .pet__b{width:100%}
  .pet img{width:100%;display:block;image-rendering:pixelated;filter:drop-shadow(0 8px 12px rgba(150,90,50,.35))}
  .treat{position:fixed;z-index:4;font-size:26px;transform:translate(-50%,-50%);pointer-events:none;
    filter:drop-shadow(0 4px 6px rgba(120,90,50,.3));animation:pop .3s ease-out}
  @keyframes pop{0%{transform:translate(-50%,-50%) scale(0)}70%{transform:translate(-50%,-50%) scale(1.3)}100%{transform:translate(-50%,-50%) scale(1)}}
  .emote{position:fixed;z-index:7;pointer-events:none;font-size:1.2rem;animation:up 1.1s ease-out forwards}
  @keyframes up{0%{opacity:1;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(var(--dx),-70px) scale(1.15)}}
  .hint{position:absolute;left:0;right:0;bottom:26px;text-align:center;z-index:5;color:#7c6450;font-size:.85rem;letter-spacing:.06em;
    pointer-events:none;animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
  @media(prefers-reduced-motion:reduce){.cloud{animation:none}}
</style>
</head>
<body>
  <div class="sun" aria-hidden="true"></div>
  <div class="cloud a"></div><div class="cloud b"></div>
  <svg class="hills" viewBox="0 0 1200 200" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 120 Q220 64 460 110 T900 100 T1200 120 L1200 200 L0 200Z" fill="#bfe09a" opacity=".7"/>
    <path d="M0 160 Q300 120 620 156 T1200 158 L1200 200 L0 200Z" fill="#9fcf78" opacity=".85"/>
  </svg>

  <a class="back" href="../">← 回星球</a>
  <div class="title"><h1>小克陪你</h1><p>它会追着你的手指跑</p></div>
  <div class="fed" id="fed"></div>
  <div class="hint">点哪儿，小克就跑去吃 🍪（手指划动它会追着你）</div>

  <div class="pet" id="pet"><div class="pet__b"><img src="../claude.png" alt="小克"></div></div>
<script>
(function(){
  "use strict";
  const pet=document.getElementById("pet"),pb=pet.querySelector(".pet__b"),fedEl=document.getElementById("fed");
  let px=innerWidth*.5,py=innerHeight*.6,vx=0,vy=0,face=1,tgx=px,tgy=py,lastM=-9999,wanderT=0,fed=0;
  const treats=[];
  function show(){fedEl.textContent=fed?("已经喂了小克 "+fed+" 次 🧡"):"";}

  addEventListener("pointermove",e=>{tgx=e.clientX;tgy=e.clientY;lastM=performance.now();},{passive:true});
  addEventListener("pointerdown",e=>{
    if(e.target.closest("a"))return;
    const t={x:e.clientX,y:e.clientY,el:document.createElement("div")};
    t.el.className="treat";t.el.textContent=["🍪","🐟","⭐","🍓","🧶"][(Math.random()*5)|0];
    t.el.style.left=e.clientX+"px";t.el.style.top=e.clientY+"px";document.body.appendChild(t.el);treats.push(t);
  },{passive:true});

  function nearestTreat(){let best=null,bd=1e9;for(const t of treats){const d=Math.hypot(t.x-px,t.y-py);if(d<bd){bd=d;best=t;}}return best;}
  function emote(txt){const e=document.createElement("span");e.className="emote";e.textContent=txt;
    e.style.left=px+"px";e.style.top=(py-64)+"px";e.style.setProperty("--dx",(Math.random()*40-20)+"px");
    document.body.appendChild(e);setTimeout(()=>e.remove(),1100);}

  function step(){
    const now=performance.now();
    const tr=nearestTreat();
    let ox,oy,chasing=false,idle=false;
    if(tr){ox=tr.x;oy=tr.y;chasing=true;}
    else if(now-lastM<2600){ox=tgx;oy=tgy+34;}
    else{idle=true;if(now>wanderT){wanderT=now+1500+Math.random()*2200;tgx=innerWidth*(.15+Math.random()*.7);tgy=innerHeight*(.4+Math.random()*.45);}ox=tgx;oy=tgy;}
    const dx=ox-px,dy=oy-py,d=Math.hypot(dx,dy),maxsp=idle?1.8:(chasing?6.4:5.4),arrive=70;
    if(d>2){const ux=dx/d,uy=dy/d,want=Math.min(maxsp,d/(arrive/maxsp));vx+=(ux*want-vx)*.14;vy+=(uy*want-vy)*.14;}
    else{vx*=.8;vy*=.8;}
    px+=vx;py+=vy;
    const sp=Math.hypot(vx,vy);
    if(Math.abs(vx)>.3)face=vx<0?-1:1;
    // 吃到点心
    if(tr&&Math.hypot(tr.x-px,tr.y-py)<30){tr.el.remove();treats.splice(treats.indexOf(tr),1);fed++;show();emote(["🧡","😋","❤","✨"][(Math.random()*4)|0]);}
    const hop=sp>.6?Math.abs(Math.sin(now/85))*-9*Math.min(1,sp/3):0;
    const br=sp<=.6?(1+Math.sin(now/600)*.05):1;
    pet.style.left=px+"px";pet.style.top=py+"px";
    pb.style.transform="translateY("+hop.toFixed(1)+"px) scaleX("+face+") scaleY("+br.toFixed(3)+")";
    if(idle&&Math.random()<.005)emote(["♪","❤","✨","· ᴗ ·"][(Math.random()*4)|0]);
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);show();
})();
</script>
</body>
</html>
