<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#9fcf78" />
<title>自由探索 · 小克的世界</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet" />
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  :root{--font:"Baloo 2","Noto Serif SC",system-ui,sans-serif}
  html,body{height:100%;overflow:hidden}
  body{font-family:var(--font);color:#5a4632;background:#8fbf6a;touch-action:none}
  #c{display:block;position:fixed;inset:0;width:100%;height:100%}
  .pill{background:rgba(255,255,255,.72);color:#5a4632;border-radius:999px;font-weight:700;box-shadow:0 4px 12px rgba(80,100,60,.25)}
  .back{position:fixed;top:14px;left:14px;z-index:6;text-decoration:none;padding:8px 14px;font-size:.9rem}
  .hud{position:fixed;top:52px;left:14px;z-index:6;padding:7px 13px;font-size:.9rem}
  .bag{position:fixed;top:14px;right:14px;z-index:6;border:none;cursor:pointer;font-family:var(--font);padding:8px 14px;font-size:.9rem}
  .tip{position:fixed;top:16px;left:0;right:0;text-align:center;z-index:5;color:#3f5a2e;font-size:.82rem;
    text-shadow:0 1px 0 rgba(255,255,255,.55);pointer-events:none;transition:opacity 1s;padding:0 96px}
  .tip.hide{opacity:0}
  .stick{position:fixed;left:0;top:0;display:none;width:120px;height:120px;border-radius:50%;z-index:7;pointer-events:none;
    background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.45);box-shadow:0 6px 18px rgba(60,80,40,.2)}
  .knob{position:absolute;left:50%;top:50%;width:54px;height:54px;border-radius:50%;transform:translate(-50%,-50%);
    background:radial-gradient(circle at 38% 32%,#fff,#e7ecdf);box-shadow:0 4px 10px rgba(0,0,0,.22)}
  .pad{position:fixed;right:20px;bottom:30px;z-index:7;display:grid;grid-template-columns:repeat(2,68px);gap:12px}
  .abtn{width:68px;height:68px;border-radius:18px;border:none;cursor:pointer;font-family:var(--font);font-weight:700;font-size:.82rem;
    color:#3a2f1a;box-shadow:0 6px 16px rgba(60,80,40,.3);display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.15}
  #btnAct{background:radial-gradient(circle at 38% 30%,#ffe79a,#ffc46b)}
  #btnJump{background:radial-gradient(circle at 38% 30%,#cdecff,#8fc3ef)}
  .abtn:active{transform:scale(.93)}
  .abtn.dim{opacity:.5}
  .gatebtn{position:fixed;left:50%;bottom:118px;transform:translateX(-50%);z-index:8;display:none;border:none;cursor:pointer;
    font-family:var(--font);font-weight:700;color:#3a2f1a;background:linear-gradient(135deg,#ffe79a,#ffc46b);
    padding:11px 20px;border-radius:999px;font-size:.95rem;box-shadow:0 8px 20px rgba(150,110,40,.35)}
  .gatebtn.show{display:block}
  .banner{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:9;display:none;text-align:center;
    background:rgba(40,30,20,.84);color:#fff6e8;padding:18px 24px;border-radius:18px;max-width:88vw;
    font-family:"Noto Serif SC",serif;font-size:1.05rem;line-height:1.7;box-shadow:0 16px 40px rgba(0,0,0,.4);border:1px solid rgba(255,210,140,.4)}
  .banner.show{display:block;animation:bin .6s ease both}
  @keyframes bin{0%{opacity:0;transform:translate(-50%,-50%) scale(.8)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
  .bagpanel{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;background:rgba(30,40,20,.45);backdrop-filter:blur(3px);padding:18px}
  .bagpanel.show{display:flex}
  .bagpanel__in{background:#fff8ee;border-radius:18px;padding:20px;width:min(92vw,430px);max-height:82vh;overflow:auto;box-shadow:0 20px 50px rgba(80,100,50,.4)}
  .bagpanel h3{font-family:"Noto Serif SC",serif;color:#7a5f44;text-align:center;margin-bottom:6px}
  .bagpanel .sub{text-align:center;color:#9a8569;font-size:.82rem;margin-bottom:12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:10px}
  .cell{background:#fff;border:1px solid #ecdcc2;border-radius:12px;padding:10px 6px;text-align:center;font-size:1.7rem;position:relative}
  .cell b{position:absolute;right:5px;bottom:3px;font-size:.74rem;color:#8a715a;font-weight:700}
  .empty{color:#b09a7e;text-align:center;font-style:italic;padding:18px 0}
  .quests{margin-top:14px}
  .quests .q{font-size:.92rem;color:#6b5440;padding:9px 4px;border-top:1px dashed #ecd9bf;display:flex;justify-content:space-between;gap:8px}
  .q .ok{color:#3f9166;font-weight:700}
  .bagpanel__foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
  .bagpanel__foot button{border:none;cursor:pointer;font-family:var(--font);font-weight:700;padding:9px 16px;border-radius:999px;font-size:.9rem}
  #bagClose{background:linear-gradient(135deg,#ffe79a,#ffc46b);color:#3a2f1a}
  #bagReset{background:none;color:#b58;text-decoration:underline;box-shadow:none;padding:9px 6px}
</style>
</head>
<body>
  <canvas id="c"></canvas>
  <a class="back pill" href="../">← 回星球</a>
  <div class="hud pill" id="hud">⭐ 0 / 0</div>
  <button class="bag pill" id="bag">🎒 背包</button>
  <div class="tip" id="tip">左侧任意位置按住走路（手指在哪摇杆就在哪）· ✋拾取/对话 · ⤴跳 · 集齐⭐</div>
  <div class="stick" id="stick"><div class="knob" id="knob"></div></div>
  <div class="pad">
    <button class="abtn dim" id="btnAct">✋<br>拾取</button>
    <button class="abtn" id="btnJump">⤴<br>跳</button>
  </div>
  <button class="gatebtn" id="gatebtn"></button>
  <div class="banner" id="banner"></div>
  <div class="bagpanel" id="placePanel"><div class="bagpanel__in">
    <h3>摆一件到架子上 🏡</h3><div class="sub">点一个物品放上去（点「取下」可清空）</div>
    <div class="grid" id="placeGrid"></div>
    <div class="bagpanel__foot"><button id="placeClear">取下</button><button id="placeClose">取消</button></div>
  </div></div>
  <div class="bagpanel" id="bagpanel"><div class="bagpanel__in">
    <h3>🎒 我的背包</h3><div class="sub" id="bagsub"></div>
    <div class="grid" id="baggrid"></div>
    <div class="quests" id="bagquests"></div>
    <div class="bagpanel__foot"><button id="bagReset">清空重新探索</button><button id="bagClose">关上背包</button></div>
  </div></div>
<script>
(function(){
  "use strict";
  const cv=document.getElementById("c"),ctx=cv.getContext("2d");
  let W=0,H=0,DPR=Math.min(1.25,window.devicePixelRatio||1),vgGrad=null,rvGrad=null;
  function resize(){W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
    vgGrad=ctx.createRadialGradient(W/2,H*.46,H*.3,W/2,H*.5,H*.8);vgGrad.addColorStop(0,"rgba(0,0,0,0)");vgGrad.addColorStop(1,"rgba(30,45,20,.3)");
    rvGrad=ctx.createRadialGradient(W/2,H*.5,H*.28,W/2,H*.5,H*.86);rvGrad.addColorStop(0,"rgba(0,0,0,0)");rvGrad.addColorStop(1,"rgba(45,22,10,.36)");}
  resize();addEventListener("resize",resize);
  const WW=2200,WH=1600;

  const claude=new Image();claude.src="../claude.png";
  const claudePink=new Image();claudePink.src="../claude_pink.png";
  const prince=new Image();prince.src="../prince.png";
  const FR=["../claude_pink.png","../claude_blue.png","../claude_mint.png"].map(s=>{const i=new Image();i.src=s;return i;});

  const tile=document.createElement("canvas");tile.width=tile.height=72;{const g=tile.getContext("2d");
    g.fillStyle="#9ccf72";g.fillRect(0,0,72,72);g.fillStyle="#8ec566";for(let i=0;i<10;i++)g.fillRect((Math.random()*72)|0,(Math.random()*72)|0,2,5);
    g.fillStyle="#a9d782";for(let i=0;i<10;i++)g.fillRect((Math.random()*72)|0,(Math.random()*72)|0,2,4);}
  const pat=ctx.createPattern(tile,"repeat");
  const decals=[];const DT=["flower","tuft","tuft","mushroom","rock","clover","flower"];
  const FCOL=["#ff7aa2","#ffd24a","#ff9ec4","#c9a0ff","#ff8f6b","#fff0a0"];
  for(let i=0;i<175;i++)decals.push({x:50+Math.random()*(WW-100),y:90+Math.random()*(WH-150),t:DT[(Math.random()*DT.length)|0],c:FCOL[(Math.random()*FCOL.length)|0],r:Math.random()*6.28});
  const pollen=[];for(let i=0;i<40;i++)pollen.push({x:Math.random()*WW,y:Math.random()*WH,ph:Math.random()*6,sp:.3+Math.random()*.5});

  const trees=[[260,520],[480,860],[300,1180],[820,360],[1000,820],[1320,520],[1620,760],[1880,1080],[1500,1280],[700,1380],[1150,1180],[1950,560],[150,900],[2040,1320]].map(([x,y])=>({x,y,ph:Math.random()*6}));
  const pond={x:640,y:1060,rx:150,ry:96};
  const house={x:1660,y:1040};
  const solids=trees.map(t=>({x:t.x,y:t.y-6,r:24})).concat([{x:pond.x,y:pond.y,r:118},{x:house.x,y:house.y-6,r:58}]);

  // 预渲染静态地面（一次性，省去每帧重画草地+几十个emoji）
  const ground=document.createElement("canvas");ground.width=WW;ground.height=WH;
  function buildGround(){const g=ground.getContext("2d");
    g.fillStyle=g.createPattern(tile,"repeat");g.fillRect(0,0,WW,WH);
    // 路：深色边 + 浅色面 + 踏石高光
    g.lineCap="round";g.lineJoin="round";
    function path(){g.beginPath();g.moveTo(1100,170);g.quadraticCurveTo(900,700,1100,820);g.quadraticCurveTo(1300,980,1120,1440);
      g.moveTo(330,300);g.quadraticCurveTo(700,650,1100,820);g.quadraticCurveTo(1500,560,1880,330);}
    g.globalAlpha=.5;g.strokeStyle="#b89a63";g.lineWidth=56;path();g.stroke();
    g.globalAlpha=.85;g.strokeStyle="#e3d3a6";g.lineWidth=44;path();g.stroke();
    g.globalAlpha=.35;g.strokeStyle="#f3e8c6";g.lineWidth=10;g.setLineDash([4,30]);path();g.stroke();g.setLineDash([]);g.globalAlpha=1;
    // 池塘：渐变 + 亮边 + 睡莲
    const pg=g.createRadialGradient(pond.x-30,pond.y-24,10,pond.x,pond.y,pond.rx);pg.addColorStop(0,"#bfeaf4");pg.addColorStop(.6,"#8fd0e6");pg.addColorStop(1,"#6bb6d2");
    g.fillStyle=pg;g.beginPath();g.ellipse(pond.x,pond.y,pond.rx,pond.ry,0,0,7);g.fill();
    g.strokeStyle="rgba(255,255,255,.5)";g.lineWidth=3;g.beginPath();g.ellipse(pond.x,pond.y,pond.rx-3,pond.ry-3,0,0,7);g.stroke();
    for(const lp of [[pond.x-70,pond.y+20],[pond.x+60,pond.y-18],[pond.x+10,pond.y+34]]){g.fillStyle="#5aa06a";g.beginPath();g.ellipse(lp[0],lp[1],16,9,.4,0,7);g.fill();g.fillStyle="#ff9ec4";g.beginPath();g.arc(lp[0]+3,lp[1]-2,3,0,7);g.fill();}
    // 手绘花草装饰
    for(const d of decals){
      if(d.t==="flower"){g.strokeStyle="#5aa06a";g.lineWidth=1.6;g.beginPath();g.moveTo(d.x,d.y+3);g.lineTo(d.x,d.y+11);g.stroke();
        g.fillStyle=d.c;for(let k=0;k<5;k++){const a=k/5*6.283+d.r;g.beginPath();g.ellipse(d.x+Math.cos(a)*4.5,d.y+Math.sin(a)*4.5,3,4.2,a,0,7);g.fill();}
        g.fillStyle="#ffe27a";g.beginPath();g.arc(d.x,d.y,2.4,0,7);g.fill();}
      else if(d.t==="tuft"){g.strokeStyle="#69ad5b";g.lineWidth=2.2;for(let k=-1;k<2;k++){g.beginPath();g.moveTo(d.x+k*3,d.y+6);g.quadraticCurveTo(d.x+k*6,d.y-3,d.x+k*8,d.y-9);g.stroke();}}
      else if(d.t==="mushroom"){g.fillStyle="#7a5230";g.fillRect(d.x-2,d.y-1,4,6);g.fillStyle="#e8745a";g.beginPath();g.ellipse(d.x,d.y-1,7,5,0,Math.PI,0);g.fill();g.fillStyle="#ffe9e2";g.beginPath();g.arc(d.x-2,d.y-3,1.3,0,7);g.fill();g.beginPath();g.arc(d.x+2,d.y-2,1,0,7);g.fill();}
      else if(d.t==="rock"){g.fillStyle="#a3a8af";g.beginPath();g.ellipse(d.x,d.y,7,5,0,0,7);g.fill();g.fillStyle="#c2c7cd";g.beginPath();g.ellipse(d.x-2,d.y-1.5,3,2,0,0,7);g.fill();}
      else{g.fillStyle="#5aa06a";for(let k=0;k<3;k++){const a=k/3*6.283+d.r;g.beginPath();g.ellipse(d.x+Math.cos(a)*4,d.y+Math.sin(a)*4,3,3,0,0,7);g.fill();}}
    }
    // 柔和光照：中心提亮 + 边缘压暗
    const lg=g.createRadialGradient(WW*.46,WH*.4,220,WW*.5,WH*.5,Math.max(WW,WH)*.72);
    lg.addColorStop(0,"rgba(255,250,210,.12)");lg.addColorStop(.7,"rgba(255,250,210,0)");lg.addColorStop(1,"rgba(28,55,28,0)");
    g.fillStyle=lg;g.fillRect(0,0,WW,WH);}
  buildGround();
  // emoji 贴图缓存（用 drawImage 代替逐帧 fillText）
  const eCache={};
  function eSprite(ch,px){const k=ch+px;if(eCache[k])return eCache[k];
    const c=document.createElement("canvas");c.width=c.height=px;const g=c.getContext("2d");
    g.font=Math.round(px*0.84)+"px serif";g.textAlign="center";g.textBaseline="middle";g.fillText(ch,px/2,px/2+1);eCache[k]=c;return c;}

  const npcs=[
    {id:"prince",x:780,y:600,kind:"prince",r:92,lines:["你也在找属于自己的星球吗？✦","重要的东西，用眼睛是看不见的。"],li:0,
      quest:{name:"🌹",count:3,state:"new",ask:"能帮我找 3 朵 🌹 吗？路边好像有。",remind:"还差一点 🌹 哦",thanks:"谢谢你！这颗给你 💛",done:"我的玫瑰，是世上唯一的 🌹",reward:"💛"}},
    {id:"ocat",x:1440,y:720,kind:"cat",emo:"🐈",r:90,lines:["喵～（它蹭了蹭你）","呼噜呼噜……🐾"],li:0},
    {id:"bcat",x:1040,y:1240,kind:"cat",emo:"🐈‍⬛",r:90,lines:["喵呜——"],li:0,
      quest:{name:"🐟",count:1,state:"new",ask:"我好饿…能给我一条 🐟 吗？池塘那边有。",remind:"还没有 🐟 呀 🥺",thanks:"喵～太好吃了！送你一枚 🐾",done:"（吃饱了，满足地睡着）😴",reward:"🐾"}},
    {id:"sign",x:1300,y:980,kind:"sign",r:88,lines:["这片世界是你的，慢慢逛 🌿","试试集齐所有 ⭐ 看看？"],li:0}
  ];
  const gates=[
    {x:1100,y:170,label:"回星球",href:"../",col:"#7fd0a0"},
    {x:330,y:300,label:"愿望星空",href:"../wish/",col:"#9a86ff"},
    {x:1880,y:330,label:"小克陪你",href:"../pet/",col:"#ff9ec4"},
    {x:1120,y:1440,label:"时间胶囊",href:"../capsule/",col:"#ffc46b"}
  ];
  const friends=FR.map((img,i)=>({img,x:300+i*700,y:520+i*230,vx:0,vy:0,tx:0,ty:0,face:1,nt:0,paused:false,ph:Math.random()*6,
    id:"fr"+i,name:["小克·粉","小克·蓝","小克·薄荷"][i],lines:["嗨，一起玩呀！","这边好像有星星哦~","你也在探险吗？✨"],li:0}));

  // 收集物品（按拾取键进背包）
  let II=0;const items=[];
  function spawnItems(emo,name,n,near){for(let i=0;i<n;i++){let x,y;
    if(near){x=near.x+(Math.random()*240-120);y=near.y+(Math.random()*150-30)+near.ry;}else{x=80+Math.random()*(WW-160);y=140+Math.random()*(WH-260);}
    items.push({id:"it"+(II++),x:Math.max(60,Math.min(WW-60,x)),y:Math.max(120,Math.min(WH-60,y)),emo,name,got:false,ph:Math.random()*6});}}
  spawnItems("🌹","🌹",5);spawnItems("🐟","🐟",2,pond);
  spawnItems("🍎","🍎",3);spawnItems("🐚","🐚",2);spawnItems("🍄","🍄",3);spawnItems("🌰","🌰",3);spawnItems("💎","💎",1);spawnItems("🍯","🍯",1);spawnItems("🪶","🪶",2);

  const stars=[];for(let i=0;i<9;i++)stars.push({id:"st"+i,x:120+Math.random()*(WW-240),y:170+Math.random()*(WH-320),got:false,ph:Math.random()*6});
  let got=0,won=false,doneCount=0;

  // ===== 室内房间 =====
  let scene="world";
  const RW=1400,RH=760;
  const rp={x:RW/2,y:RH-90,vx:0,vy:0,face:1,jz:0,jvz:0};
  // 隔墙把家分成 卧室｜客厅｜书房 三个小房间（x=470 与 x=960，各留门洞 y400~500）
  const WALLS=[{x:470,y:150,w:26,h:250},{x:470,y:500,w:26,h:RH-500},{x:960,y:150,w:26,h:250},{x:960,y:500,w:26,h:RH-500}];
  const furn=[
    {x:90,y:438,w:240,h:150},{x:1020,y:66,w:250,h:270},{x:600,y:150,w:160,h:100},
    {x:564,y:506,w:175,h:86},{x:788,y:506,w:124,h:60},{x:1118,y:566,w:190,h:72},{x:338,y:478,w:64,h:58}
  ].concat(WALLS);
  const slots=[{x:1062,y:126},{x:1132,y:126},{x:1202,y:126},{x:680,y:132},{x:850,y:512},{x:172,y:128},{x:1202,y:556}].map(s=>({x:s.x,y:s.y,item:null}));
  const door={x:RW/2,y:RH-22};
  const phone={x:1262,y:556};
  const catRoom={x:206,y:498};
  const claudeRoom={x:656,y:548};
  const bulbs=[];for(let i=0;i<16;i++){const t=i/15;bulbs.push({x:40+t*(RW-80),y:16+Math.sin(t*Math.PI)*16,c:["#ff7a7a","#ffd24a","#7fd0ff","#9ae08a","#d9a0ff"][i%5]});}

  // 存档
  const SK="world_save_v1";
  let inv={};
  function load(){try{const s=JSON.parse(localStorage.getItem(SK));if(!s)return;
    inv=s.inv||{};(s.gotItems||[]).forEach(id=>{const it=items.find(i=>i.id===id);if(it)it.got=true;});
    (s.gotStars||[]).forEach(id=>{const st=stars.find(x=>x.id===id);if(st){st.got=true;}});
    got=stars.filter(s2=>s2.got).length;
    if(s.quests)for(const n of npcs)if(n.quest&&s.quests[n.id])n.quest.state=s.quests[n.id];
    doneCount=npcs.filter(n=>n.quest&&n.quest.state==="done").length;
    if(s.deco)s.deco.forEach((e,i)=>{if(slots[i])slots[i].item=e;});
  }catch(e){}}
  function save(){try{const q={};for(const n of npcs)if(n.quest)q[n.id]=n.quest.state;
    localStorage.setItem(SK,JSON.stringify({inv,gotItems:items.filter(i=>i.got).map(i=>i.id),gotStars:stars.filter(s=>s.got).map(s=>s.id),quests:q,deco:slots.map(s=>s.item)}));}catch(e){}}
  load();
  const hud=document.getElementById("hud");const updHud=()=>hud.textContent="⭐ "+got+" / "+stars.length;updHud();

  const player={x:1100,y:820,vx:0,vy:0,face:1,jz:0,jvz:0};
  const cat={x:1060,y:880,vx:0,vy:0,face:1};
  const SPEED=3.1;let camX=player.x-W/2,camY=player.y-H/2;
  const parts=[];function P(x,y,vx,vy,life,col,size,grav){parts.push({x,y,vx,vy,life,max:life,col,size,grav:grav||0});}

  let AC=null;function audio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}}
  function beep(f,d,t,g){if(!AC)return;const o=AC.createOscillator(),v=AC.createGain();o.type=t||"sine";o.frequency.value=f;
    v.gain.value=0;o.connect(v);v.connect(AC.destination);const n=AC.currentTime;v.gain.linearRampToValueAtTime(g||.06,n+.01);
    v.gain.exponentialRampToValueAtTime(.0001,n+d);o.start(n);o.stop(n+d);}
  const chime=()=>{beep(880,.18,"sine",.05);setTimeout(()=>beep(1175,.22,"sine",.05),70);setTimeout(()=>beep(1568,.3,"sine",.05),150);};

  function jUpd(e){const r=stick.getBoundingClientRect();let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);
    const d=Math.hypot(dx,dy);if(d>JR){dx=dx/d*JR;dy=dy/d*JR;}knob.style.transform="translate("+(dx-27)+"px,"+(dy-27)+"px)";jx=dx/JR;jy=dy/JR;}
  function jEnd(){jId=null;jx=jy=0;knob.style.transform="translate(-50%,-50%)";stick.style.display="none";}
  addEventListener("pointerdown",e=>{if(jId!==null)return;
    if(e.target.closest&&e.target.closest("#btnJump,#btnAct,#bag,.back,.bagpanel,.gatebtn"))return;

  addEventListener("pointermove",e=>{if(e.pointerId===jId)jUpd(e);},{passive:true});

  function marioJump(){if(!AC)return;const o=AC.createOscillator(),v=AC.createGain(),n=AC.currentTime;o.type="square";
    o.frequency.setValueAtTime(380,n);o.frequency.exponentialRampToValueAtTime(1180,n+0.12);o.frequency.exponentialRampToValueAtTime(740,n+0.22);
    v.gain.setValueAtTime(0.0001,n);v.gain.linearRampToValueAtTime(0.09,n+0.012);v.gain.exponentialRampToValueAtTime(0.0001,n+0.26);
    o.connect(v);v.connect(AC.destination);o.start(n);o.stop(n+0.28);}

    if(act.type==="item"){const it=act.o;it.got=true;inv[it.name]=(inv[it.name]||0)+1;pick();

    const o=act.o;
    if(o.quest){const q=o.quest;

      else if(q.state==="active"){
        if((inv[q.name]||0)>=q.count){inv[q.name]-=q.count;q.state="done";reward(q.reward);say(o,q.thanks);chime();doneCount++;save();
          if(doneCount>=npcs.filter(n=>n.quest).length){winSfx();showBanner("你帮助了这里的每一个朋友 🧡<br>谢谢你，温柔的旅行者");}}
        else say(o,q.remind+"（"+(inv[q.name]||0)+"/"+q.count+"）");
      }else{q.state="active";save();say(o,q.ask);}

    if(moving&&player.jz<=0&&tnow>stepT){stepT=tnow+120;P(player.x+(Math.random()*8-4),player.y,(Math.random()*1-.5),-.4,24,"rgba(190,170,130,",2,.02);}

    // 跟随猫
    {const ox=player.x-26*player.face,oy=player.y+6,dx=ox-cat.x,dy=oy-cat.y,d=Math.hypot(dx,dy);
     const ms=d>140?4.2:(d>40?2.4:0);if(d>2){cat.vx+=((dx/d)*ms-cat.vx)*.15;cat.vy+=((dy/d)*ms-cat.vy)*.15;}else{cat.vx*=.8;cat.vy*=.8;}
     cat.x+=cat.vx;cat.y+=cat.vy;if(Math.abs(cat.vx)>.2)cat.face=cat.vx<0?-1:1;}

      f.vx+=(sx-f.vx)*0.08;f.vy+=(sy-f.vy)*0.08;f.x+=f.vx;f.y+=f.vy;collide(f);
      if(Math.abs(f.vx)>0.15)f.face=f.vx<0?-1:1;}

    // 星星（自动）

      if(got===stars.length&&!won){won=true;winSfx();fireworks();showBanner("✨ 你集齐了所有星星！<br>这个小世界，因你而闪亮 ✨",5200);}}}

    // 最近可互动：物品优先，其次 NPC/朋友

    if(!act){let nd=1e9;

      if(xx<camX-20||xx>camX+W+20||yy<camY-20||yy>camY+H+20)continue;ctx.globalAlpha=.5+.4*Math.sin(tnow/500+p.ph);ctx.beginPath();ctx.arc(xx,yy,2,0,7);ctx.fill();}

        ctx.fillStyle=fgd;ctx.beginPath();ctx.arc(t.x+sw,t.y-46,31,0,7);ctx.arc(t.x-23+sw,t.y-33,23,0,7);ctx.arc(t.x+23+sw,t.y-33,23,0,7);ctx.arc(t.x+sw,t.y-26,24,0,7);ctx.fill();
        ctx.fillStyle="rgba(255,255,255,.18)";ctx.beginPath();ctx.arc(t.x-12+sw,t.y-54,12,0,7);ctx.fill();

        ctx.fillStyle="#ff9ec4";for(let k=0;k<3;k++){const a=k*2.1+t.ph;ctx.beginPath();ctx.arc(t.x+sw+Math.cos(a)*20,t.y-40+Math.sin(a)*16,2.4,0,7);ctx.fill();}}

      else if(it.t==="gate"){const g=it.o,pulse=.5+.5*Math.sin(tnow/400);shadow(g.x,g.y+2,24);

    g.fillStyle="#fff";g.fillRect(866,506,18,12);g.fillStyle="#fff";g.beginPath();g.arc(886,512,5,0,7);g.stroke();g.strokeStyle="#caa";g.lineWidth=2;g.beginPath();g.arc(886,512,5,0,7);g.stroke();
    g.fillStyle="#b07a4a";g.fillRect(868,508,14,5);
    // 吊灯（吊在桌子上方）
    g.strokeStyle="#7a655a";g.lineWidth=3;g.beginPath();g.moveTo(850,0);g.lineTo(850,318);g.stroke();
    g.fillStyle="#caa86a";g.beginPath();g.moveTo(822,348);g.lineTo(878,348);g.lineTo(866,318);g.lineTo(834,318);g.closePath();g.fill();
    g.fillStyle="#fff3c0";g.beginPath();g.ellipse(850,348,28,7,0,0,7);g.fill();
    // 阳光斜照（地面光斑）
    g.fillStyle="rgba(255,240,180,.22)";g.beginPath();g.moveTo(110,160);g.lineTo(250,160);g.lineTo(320,300);g.lineTo(180,300);g.closePath();g.fill();
    // 串灯（电线 + 彩灯，发光在 roomStep）
    g.strokeStyle="rgba(90,70,50,.6)";g.lineWidth=2;g.beginPath();g.moveTo(bulbs[0].x,bulbs[0].y);for(const b of bulbs)g.lineTo(b.x,b.y);g.stroke();
    for(const b of bulbs){g.fillStyle=b.c;g.beginPath();g.arc(b.x,b.y+4,3.4,0,7);g.fill();}
    // 门垫
    g.fillStyle="#caa96a";g.beginPath();g.ellipse(door.x,door.y,64,18,0,0,7);g.fill();
    g.fillStyle="#6b5440";g.font="700 13px sans-serif";g.textAlign="center";g.fillText("欢迎回家 ♡",door.x,door.y+5);}
  buildRoom();

  function phoneMsg(){const d=new Date(),t=d.getHours()+":"+String(d.getMinutes()).padStart(2,"0");
    const M=["📱 小克：今天也辛苦啦，抱抱 🧡","📱 1 条新消息：要开心鸭 🌷","📱 备忘：记得给玫瑰浇水 🌹","📱 天气：今天有点想你 ☁️","📱 妈妈：早点睡哦 🌙"];
    showBanner("现在是 "+t+"<br>"+M[(Math.random()*M.length)|0],3200);}
  const placePanel=document.getElementById("placePanel"),placeGrid=document.getElementById("placeGrid");let curSlot=null;
  function openPlace(s){curSlot=s;const ks=Object.keys(inv).filter(k=>inv[k]>0);
    placeGrid.innerHTML=ks.length?ks.map(k=>'<div class="cell" data-e="'+k+'">'+k+'</div>').join(""):'<div class="empty">背包空空的，先去收集物品~</div>';
    placePanel.classList.add("show");}
  placeGrid.addEventListener("click",e=>{const c=e.target.closest(".cell");if(!c||!curSlot)return;curSlot.item=c.dataset.e;save();placePanel.classList.remove("show");});
  document.getElementById("placeClear").addEventListener("click",()=>{if(curSlot){curSlot.item=null;save();}placePanel.classList.remove("show");});
  document.getElementById("placeClose").addEventListener("click",()=>placePanel.classList.remove("show"));
  placePanel.addEventListener("pointerdown",e=>{if(e.target===placePanel)placePanel.classList.remove("show");});

  function roomStep(tnow,ix,iy,mag){
    const moving=mag>0.06;
    rp.x+=ix*2.7;rp.y+=iy*2.7;
    if(Math.abs(ix)>0.06)rp.face=ix<0?-1:1;
    rp.x=Math.max(38,Math.min(RW-38,rp.x));rp.y=Math.max(176,Math.min(RH-28,rp.y));
    for(const f of furn){const cx=Math.max(f.x,Math.min(rp.x,f.x+f.w)),cy=Math.max(f.y,Math.min(rp.y,f.y+f.h)),dx=rp.x-cx,dy=rp.y-cy,d=Math.hypot(dx,dy);
      if(d<14){if(d<0.01)rp.y=f.y+f.h+14;else{rp.x=cx+dx/d*14;rp.y=cy+dy/d*14;}}}
    const wasAir=rp.jz>0;rp.jz+=rp.jvz;rp.jvz-=0.5;if(rp.jz<=0){rp.jz=0;rp.jvz=0;if(wasAir){}}
    // 互动检测
    act=null;let bd=1e9;
    for(const s of slots){const d=Math.hypot(s.x-rp.x,s.y-rp.y);if(d<74&&d<bd){bd=d;act={type:"slot",o:s};}}
    const dp=Math.hypot(phone.x-rp.x,phone.y-rp.y);if(dp<58&&dp<bd){bd=dp;act={type:"phone"};}
    const dd=Math.hypot(door.x-rp.x,door.y-rp.y);if(dd<62&&dd<bd){bd=dd;act={type:"exit"};}
    const ab=document.getElementById("btnAct");
    if(act){ab.classList.remove("dim");ab.innerHTML=act.type==="exit"?"🚪<br>出门":act.type==="phone"?"📱<br>看":(act.o.item?"🔄<br>换/取":"✋<br>摆放");}
    else{ab.classList.add("dim");ab.innerHTML="✋<br>摆放";}
    document.getElementById("gatebtn").classList.remove("show");

    let tcx=Math.max(0,Math.min(RW-W,rp.x-W/2)),tcy=Math.max(0,Math.min(RH-H,rp.y-H/2));
    if(RW<W)tcx=(RW-W)/2;if(RH<H)tcy=(RH-H)/2;camX+=(tcx-camX)*.15;camY+=(tcy-camY)*.15;

    ctx.clearRect(0,0,W,H);ctx.fillStyle="#212c34";ctx.fillRect(0,0,W,H);
    ctx.save();ctx.translate(-camX,-camY);
    const sx=Math.max(0,Math.min(camX,RW-1)),sy=Math.max(0,Math.min(camY,RH-1)),sw=Math.min(W,RW-sx),sh=Math.min(H,RH-sy);
    ctx.drawImage(roomBg,sx,sy,sw,sh,sx,sy,sw,sh);
    // 壁炉火焰
    if(Math.random()<0.7){const fx=680+(Math.random()*60-30);P(fx,238,(Math.random()*0.8-0.4),-1-Math.random()*1.3,28,["rgba(255,170,60,","rgba(255,120,40,","rgba(255,220,120,"][(Math.random()*3)|0],3+Math.random()*2,-0.02);}
    ctx.save();ctx.globalAlpha=.4+.2*Math.sin(tnow/120);ctx.fillStyle="rgba(255,150,60,.5)";ctx.beginPath();ctx.ellipse(680,236,42,16,0,0,7);ctx.fill();ctx.restore();
    // 暖光（壁炉 + 台灯，lighter 叠加）
    ctx.save();ctx.globalCompositeOperation="lighter";
    const fg=ctx.createRadialGradient(680,210,6,680,210,150);fg.addColorStop(0,"rgba(255,170,80,"+(.32+.08*Math.sin(tnow/130))+")");fg.addColorStop(1,"rgba(255,170,80,0)");ctx.fillStyle=fg;ctx.beginPath();ctx.arc(680,210,150,0,7);ctx.fill();
    const lg=ctx.createRadialGradient(370,440,4,370,440,96);lg.addColorStop(0,"rgba(255,226,150,.34)");lg.addColorStop(1,"rgba(255,226,150,0)");ctx.fillStyle=lg;ctx.beginPath();ctx.arc(370,440,96,0,7);ctx.fill();
    ctx.restore();
    // 挂钟指针
    {const d=new Date(),hh=(d.getHours()%12)/12*6.283+d.getMinutes()/60*0.5236,mm=d.getMinutes()/60*6.283;
     ctx.strokeStyle="#5a4636";ctx.lineCap="round";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(545,80);ctx.lineTo(545+Math.sin(hh)*12,80-Math.cos(hh)*12);ctx.stroke();
     ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(545,80);ctx.lineTo(545+Math.sin(mm)*19,80-Math.cos(mm)*19);ctx.stroke();}
    // 睡在床上的猫（呼吸）
    {const br=1+Math.sin(tnow/750)*0.06;ctx.save();ctx.translate(catRoom.x,catRoom.y);ctx.scale(1.1,br);ctx.drawImage(eSprite("🐈",34),-17,-30,34,34);ctx.restore();
     ctx.fillStyle="#7a5f44";ctx.font="11px sans-serif";ctx.textAlign="center";ctx.globalAlpha=.5+.3*Math.sin(tnow/600);ctx.fillText("Zzz",catRoom.x+18,catRoom.y-26);ctx.globalAlpha=1;}
    // 沙发上的粉色小克朋友（和你区分开）
    {const bob=Math.sin(tnow/600)*2;if(claudePink.complete&&claudePink.naturalWidth){ctx.imageSmoothingEnabled=false;const w=40,h=w*(claudePink.naturalHeight/claudePink.naturalWidth);
       ctx.fillStyle="rgba(0,0,0,.14)";ctx.beginPath();ctx.ellipse(claudeRoom.x,claudeRoom.y+2,15,5,0,0,7);ctx.fill();
       ctx.drawImage(claudePink,claudeRoom.x-w/2,claudeRoom.y-h+bob,w,h);
       ctx.fillStyle="#b85a7a";ctx.font="700 11px 'Noto Serif SC',serif";ctx.textAlign="center";ctx.fillText("小克",claudeRoom.x,claudeRoom.y-h+bob-4);}}
    // 串灯发光
    ctx.save();ctx.globalCompositeOperation="lighter";
    for(let i=0;i<bulbs.length;i++){const b=bulbs[i],a=.4+.5*Math.sin(tnow/400+i*0.9);ctx.globalAlpha=a;ctx.fillStyle=b.c;ctx.beginPath();ctx.arc(b.x,b.y+4,6,0,7);ctx.fill();}
    ctx.restore();ctx.globalAlpha=1;
    // 吊灯暖光
    {const pg=ctx.createRadialGradient(850,352,6,850,352,120);pg.addColorStop(0,"rgba(255,232,150,.3)");pg.addColorStop(1,"rgba(255,232,150,0)");
     ctx.save();ctx.globalCompositeOperation="lighter";ctx.fillStyle=pg;ctx.beginPath();ctx.arc(850,352,120,0,7);ctx.fill();ctx.restore();}
    // 桌上手机
    {const hi=act&&act.type==="phone";ctx.fillStyle="#2a2a32";rr(phone.x-9,phone.y-18,18,30,4);ctx.fill();
     ctx.fillStyle=Math.sin(tnow/500)>0?"#9ad0ff":"#bfe6ff";rr(phone.x-7,phone.y-16,14,24,2);ctx.fill();
     if(hi){ctx.strokeStyle="rgba(255,235,150,.95)";ctx.lineWidth=2;ctx.beginPath();ctx.arc(phone.x,phone.y-4,18,0,7);ctx.stroke();}}
    // 槽位与摆件
    for(const s of slots){const hi=act&&act.type==="slot"&&act.o===s;
      if(hi){ctx.strokeStyle="rgba(255,235,150,.9)";ctx.lineWidth=2;ctx.beginPath();ctx.arc(s.x,s.y-6,17,0,7);ctx.stroke();}
      if(s.item)ctx.drawImage(eSprite(s.item,28),s.x-14,s.y-22,28,28);
      else if(hi){ctx.globalAlpha=.6;ctx.fillStyle="#fff";ctx.font="12px sans-serif";ctx.textAlign="center";ctx.fillText("放这里",s.x,s.y-2);ctx.globalAlpha=1;}}
    // 玩家
    const bob=(moving&&rp.jz<=0)?Math.abs(Math.sin(tnow/90))*-7:0;
    ctx.fillStyle="rgba(0,0,0,.18)";ctx.beginPath();ctx.ellipse(rp.x,rp.y+2,16*(1-Math.min(.5,rp.jz/40)),5,0,0,7);ctx.fill();
    if(claude.complete&&claude.naturalWidth){ctx.imageSmoothingEnabled=false;const w=46,h=w*(claude.naturalHeight/claude.naturalWidth);
      ctx.save();ctx.translate(rp.x,rp.y+bob-rp.jz);ctx.scale(rp.face,1);ctx.drawImage(claude,-w/2,-h,w,h);ctx.restore();}
    else{ctx.fillStyle="#e8945a";ctx.fillRect(rp.x-16,rp.y-30,32,30);}
    // 粒子
    for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=p.grav;p.life--;
      if(p.life<=0){parts.splice(i,1);continue;}const al=p.life/p.max;ctx.globalAlpha=al;
      ctx.fillStyle=(typeof p.col==="string"&&p.col.indexOf("txt:")===0)?"#ffcf5a":(p.col+al+")");
      if(typeof p.col==="string"&&p.col.indexOf("txt:")===0){ctx.font="700 18px sans-serif";ctx.textAlign="center";ctx.fillText(p.col.slice(4),p.x,p.y);}
      else{ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,7);ctx.fill();}}
    ctx.globalAlpha=1;ctx.restore();
    ctx.fillStyle="rgba(255,255,255,.92)";ctx.font="700 17px 'Noto Serif SC',serif";ctx.textAlign="center";ctx.fillText("🏡 小克的家",W/2,32);
  }

  function fireworks(){for(let b=0;b<5;b++)setTimeout(()=>{const x=player.x+(Math.random()*300-150),y=player.y-100-Math.random()*120;
    const cols=["255,120,120","120,200,255","255,221,120","200,140,255","160,240,180"][b%5];
    for(let i=0;i<26;i++){const a=Math.random()*6.28,sp=1.5+Math.random()*3.5;P(x,y,Math.cos(a)*sp,Math.sin(a)*sp,50,"rgba("+cols+",",2+Math.random()*2,.05);}},b*260);}
  function hex2(h){h=h.replace("#","");return parseInt(h.slice(0,2),16)+","+parseInt(h.slice(2,4),16)+","+parseInt(h.slice(4,6),16);}
  function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
  function miniMap(){const mw=108,mh=mw*WH/WW,mx=W-mw-14,my=92,sx=mw/WW,sy=mh/WH;
    ctx.save();ctx.globalAlpha=.85;ctx.fillStyle="rgba(255,255,255,.55)";rr(mx-4,my-4,mw+8,mh+8,10);ctx.fill();
    ctx.fillStyle="#9ccf72";rr(mx,my,mw,mh,6);ctx.fill();rr(mx,my,mw,mh,6);ctx.clip();
    ctx.fillStyle="#8fd0e6";ctx.beginPath();ctx.ellipse(mx+pond.x*sx,my+pond.y*sy,pond.rx*sx,pond.ry*sy,0,0,7);ctx.fill();
    for(const g of gates){ctx.fillStyle=g.col;ctx.beginPath();ctx.arc(mx+g.x*sx,my+g.y*sy,2.6,0,7);ctx.fill();}
    ctx.fillStyle="#ffcf5a";for(const st of stars){if(st.got)continue;ctx.beginPath();ctx.arc(mx+st.x*sx,my+st.y*sy,1.8,0,7);ctx.fill();}
    ctx.fillStyle="#7a5230";for(const it of items){if(it.got)continue;ctx.beginPath();ctx.arc(mx+it.x*sx,my+it.y*sy,1.4,0,7);ctx.fill();}
    for(const f of friends){ctx.fillStyle="#ff8fb3";ctx.beginPath();ctx.arc(mx+f.x*sx,my+f.y*sy,1.8,0,7);ctx.fill();}
    ctx.fillStyle="#e8602a";ctx.beginPath();ctx.arc(mx+player.x*sx,my+player.y*sy,3.2,0,7);ctx.fill();ctx.restore();}
  requestAnimationFrame(step);
})();
