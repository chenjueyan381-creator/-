<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#9fcf78" />
<title>自由探索 · 小克的世界</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet" />
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  :root{--font:"Baloo 2","Noto Serif SC",system-ui,sans-serif}
  html,body{height:100%;overflow:hidden}
  body{font-family:var(--font);color:#5a4632;background:#8fbf6a;touch-action:none}
  #c{display:block;position:fixed;inset:0;width:100%;height:100%}

  .back{position:fixed;top:14px;left:14px;z-index:6;text-decoration:none;background:rgba(255,255,255,.7);
    color:#5a4632;padding:8px 14px;border-radius:999px;font-weight:700;font-size:.9rem;box-shadow:0 4px 12px rgba(80,100,60,.25)}
  .hud{position:fixed;top:14px;right:14px;z-index:6;background:rgba(255,255,255,.7);color:#5a4632;
    padding:8px 14px;border-radius:999px;font-weight:700;font-size:.9rem;box-shadow:0 4px 12px rgba(80,100,60,.25)}
  .tip{position:fixed;top:54px;left:0;right:0;text-align:center;z-index:6;color:#3f5a2e;font-size:.82rem;
    text-shadow:0 1px 0 rgba(255,255,255,.5);pointer-events:none}

  .stick{position:fixed;left:24px;bottom:24px;width:124px;height:124px;border-radius:50%;z-index:7;
    background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.45);box-shadow:0 6px 18px rgba(60,80,40,.2);touch-action:none}
  .knob{position:absolute;left:50%;top:50%;width:56px;height:56px;border-radius:50%;transform:translate(-50%,-50%);
    background:radial-gradient(circle at 38% 32%,#fff,#e7ecdf);box-shadow:0 4px 10px rgba(0,0,0,.22)}
  .gatebtn{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);z-index:8;display:none;border:none;cursor:pointer;
    font-family:var(--font);font-weight:700;color:#3a2f1a;background:linear-gradient(135deg,#ffe79a,#ffc46b);
    padding:13px 22px;border-radius:999px;font-size:1rem;box-shadow:0 8px 20px rgba(150,110,40,.35);animation:bp 1.4s ease-in-out infinite}
  .gatebtn.show{display:block}
  @keyframes bp{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-4px)}}
</style>
</head>
<body>
  <canvas id="c"></canvas>
  <a class="back" href="../">← 回星球</a>
  <div class="hud" id="hud">⭐ 0 / 0</div>
  <div class="tip">用左下摇杆走路（电脑用 WASD/方向键）· 去探索吧</div>
  <div class="stick" id="stick"><div class="knob" id="knob"></div></div>
  <button class="gatebtn" id="gatebtn"></button>
<script>
(function(){
  "use strict";
  const cv=document.getElementById("c"),ctx=cv.getContext("2d");
  let W=0,H=0,DPR=Math.min(2,window.devicePixelRatio||1);
  function resize(){W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
  resize();addEventListener("resize",resize);

  const WW=2200,WH=1600;

  // 资源
  const claude=new Image();claude.src="../claude.png";
  const prince=new Image();prince.src="../prince.png";

  // 地面草纹（小贴图）
  const tile=document.createElement("canvas");tile.width=tile.height=72;{const g=tile.getContext("2d");
    g.fillStyle="#9ccf72";g.fillRect(0,0,72,72);
    g.fillStyle="#8ec566";for(let i=0;i<10;i++){g.fillRect((Math.random()*72)|0,(Math.random()*72)|0,2,5);}
    g.fillStyle="#a9d782";for(let i=0;i<10;i++){g.fillRect((Math.random()*72)|0,(Math.random()*72)|0,2,4);}}
  const pat=ctx.createPattern(tile,"repeat");

  // 装饰（地面贴花，随机一次）
  const decals=[];
  const EMO=["🌷","🌼","🍄","🌻","🪨","🍀","🌸"];
  for(let i=0;i<140;i++)decals.push({x:60+Math.random()*(WW-120),y:80+Math.random()*(WH-140),e:EMO[(Math.random()*EMO.length)|0],s:18+Math.random()*12});

  // 树（障碍）
  const trees=[[260,520],[480,860],[300,1180],[820,360],[1000,820],[1320,520],[1620,760],[1880,1080],[1500,1280],[700,1380],[1150,1180],[1950,560],[150,900],[2040,1320]]
    .map(([x,y])=>({x,y}));
  const pond={x:640,y:1060,rx:150,ry:96};
  const house={x:1660,y:1040};

  // 障碍碰撞圆
  const solids=trees.map(t=>({x:t.x,y:t.y-6,r:26})).concat([{x:pond.x,y:pond.y,r:120},{x:house.x,y:house.y-6,r:60}]);

  // NPC
  const npcs=[
    {x:780,y:600,kind:"prince",r:120,line:"你也在找属于自己的星球吗？✦"},
    {x:1440,y:720,kind:"cat",emo:"🐈",r:110,line:"喵～（它蹭了蹭你）"},
    {x:1040,y:1240,kind:"cat",emo:"🐈‍⬛",r:110,line:"呼噜呼噜……🐾"},
    {x:1300,y:980,kind:"sign",r:110,line:"这片世界是你的，慢慢逛 🌿"}
  ];

  // 传送门
  const gates=[
    {x:1100,y:170,label:"回星球",href:"../",col:"#7fd0a0"},
    {x:330,y:300,label:"愿望星空",href:"../wish/",col:"#9a86ff"},
    {x:1880,y:330,label:"小克陪你",href:"../pet/",col:"#ff9ec4"},
    {x:1120,y:1440,label:"时间胶囊",href:"../capsule/",col:"#ffc46b"}
  ];

  // 收集星星
  const stars=[];
  for(let i=0;i<9;i++)stars.push({x:120+Math.random()*(WW-240),y:160+Math.random()*(WH-300),got:false});
  let got=0;
  const hud=document.getElementById("hud");
  function updHud(){hud.textContent="⭐ "+got+" / "+stars.length;}
  updHud();

  // 玩家
  const player={x:1100,y:820,vx:0,vy:0,face:1};
  const SPEED=3.0;

  // 输入：摇杆
  const stick=document.getElementById("stick"),knob=document.getElementById("knob");
  let jActive=false,jx=0,jy=0;const JR=38;
  function jUpd(e){const r=stick.getBoundingClientRect();let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);
    const d=Math.hypot(dx,dy);if(d>JR){dx=dx/d*JR;dy=dy/d*JR;}knob.style.transform="translate("+(dx-28)+"px,"+(dy-28)+"px)";
    jx=dx/JR;jy=dy/JR;}
  stick.addEventListener("pointerdown",e=>{jActive=true;try{stick.setPointerCapture(e.pointerId);}catch(_){}jUpd(e);});
  stick.addEventListener("pointermove",e=>{if(jActive)jUpd(e);});
  function jEnd(){jActive=false;jx=jy=0;knob.style.transform="translate(-50%,-50%)";}
  stick.addEventListener("pointerup",jEnd);stick.addEventListener("pointercancel",jEnd);
  // 键盘
  const keys={};
  addEventListener("keydown",e=>{keys[e.key.toLowerCase()]=true;});
  addEventListener("keyup",e=>{keys[e.key.toLowerCase()]=false;});

  // 传送按钮
  const gbtn=document.getElementById("gatebtn");let nearGate=null;
  gbtn.addEventListener("click",()=>{if(nearGate)location.href=nearGate.href;});

  function circForce(x,y,r){ // 把玩家推出障碍
    const dx=player.x-x,dy=player.y-y,d=Math.hypot(dx,dy),min=r+13;
    if(d<min&&d>0.001){const n=(min-d);player.x+=dx/d*n;player.y+=dy/d*n;}
  }

  function step(){
    // 输入合成
    let kx=0,ky=0;
    if(keys["arrowleft"]||keys["a"])kx-=1;if(keys["arrowright"]||keys["d"])kx+=1;
    if(keys["arrowup"]||keys["w"])ky-=1;if(keys["arrowdown"]||keys["s"])ky+=1;
    let ix=Math.max(-1,Math.min(1,jx+kx)),iy=Math.max(-1,Math.min(1,jy+ky));
    let mag=Math.hypot(ix,iy);if(mag>1){ix/=mag;iy/=mag;mag=1;}
    player.vx=ix*SPEED;player.vy=iy*SPEED;
    const moving=mag>0.06;
    player.x+=player.vx;player.y+=player.vy;
    if(Math.abs(player.vx)>0.2)player.face=player.vx<0?-1:1;
    // 边界
    player.x=Math.max(34,Math.min(WW-34,player.x));player.y=Math.max(70,Math.min(WH-24,player.y));
    // 障碍
    for(const s of solids)circForce(s.x,s.y,s.r);
    // 收集星星
    for(const st of stars){if(!st.got&&Math.hypot(st.x-player.x,st.y-player.y)<34){st.got=true;got++;updHud();
      for(let i=0;i<8;i++){/*粒子省略*/}}}
    // 最近传送门
    nearGate=null;let bd=80;
    for(const g of gates){const d=Math.hypot(g.x-player.x,g.y-player.y);if(d<bd){bd=d;nearGate=g;}}
    if(nearGate){gbtn.textContent="进入 "+nearGate.label+" ➜";gbtn.classList.add("show");}else gbtn.classList.remove("show");
    // 最近 NPC 对话
    let talk=null,td=1e9;for(const n of npcs){const d=Math.hypot(n.x-player.x,n.y-player.y);if(d<n.r&&d<td){td=d;talk=n;}}

    // 相机
    let camX=Math.max(0,Math.min(WW-W,player.x-W/2)),camY=Math.max(0,Math.min(WH-H,player.y-H/2));
    if(WW<W)camX=(WW-W)/2;if(WH<H)camY=(WH-H)/2;

    ctx.clearRect(0,0,W,H);
    ctx.save();ctx.translate(-camX,-camY);
    // 地面
    ctx.fillStyle=pat;ctx.fillRect(camX,camY,W,H);
    // 路
    ctx.strokeStyle="#d9c89a";ctx.lineWidth=46;ctx.lineCap="round";ctx.globalAlpha=.7;
    ctx.beginPath();ctx.moveTo(1100,170);ctx.quadraticCurveTo(900,700,1100,820);ctx.quadraticCurveTo(1300,980,1120,1440);ctx.stroke();
    ctx.beginPath();ctx.moveTo(330,300);ctx.quadraticCurveTo(700,650,1100,820);ctx.quadraticCurveTo(1500,560,1880,330);ctx.stroke();
    ctx.globalAlpha=1;
    // 池塘
    ctx.fillStyle="#8fd0e6";ctx.beginPath();ctx.ellipse(pond.x,pond.y,pond.rx,pond.ry,0,0,7);ctx.fill();
    ctx.fillStyle="#b6e6f2";ctx.beginPath();ctx.ellipse(pond.x-30,pond.y-22,pond.rx*0.5,pond.ry*0.4,0,0,7);ctx.fill();
    // 地面贴花（视野内）
    ctx.textAlign="center";ctx.textBaseline="alphabetic";
    for(const d of decals){if(d.x<camX-40||d.x>camX+W+40||d.y<camY-40||d.y>camY+H+40)continue;
      ctx.font=d.s+"px serif";ctx.fillText(d.e,d.x,d.y);}
    // 收集星星
    for(const st of stars){if(st.got)continue;ctx.font="30px serif";ctx.fillText("⭐",st.x,st.y);}

    // 需要 y 排序的精灵
    const sp=[];
    for(const g of gates)sp.push({y:g.y,t:"gate",o:g});
    for(const t of trees)sp.push({y:t.y,t:"tree",o:t});
    for(const n of npcs)sp.push({y:n.y,t:"npc",o:n});
    sp.push({y:house.y,t:"house",o:house});
    sp.push({y:player.y,t:"player"});
    sp.sort((a,b)=>a.y-b.y);
    const tnow=performance.now();
    for(const it of sp){
      if(it.t==="tree"){const t=it.o;ctx.fillStyle="#7a5230";ctx.fillRect(t.x-6,t.y-26,12,28);
        ctx.fillStyle="#4ea35e";ctx.beginPath();ctx.arc(t.x,t.y-44,30,0,7);ctx.arc(t.x-22,t.y-32,22,0,7);ctx.arc(t.x+22,t.y-32,22,0,7);ctx.fill();
        ctx.fillStyle="#5cb86c";ctx.beginPath();ctx.arc(t.x-8,t.y-50,16,0,7);ctx.fill();}
      else if(it.t==="house"){const h=it.o;ctx.fillStyle="#e8d3a8";ctx.fillRect(h.x-46,h.y-58,92,58);
        ctx.fillStyle="#c8794f";ctx.beginPath();ctx.moveTo(h.x-56,h.y-58);ctx.lineTo(h.x,h.y-100);ctx.lineTo(h.x+56,h.y-58);ctx.closePath();ctx.fill();
        ctx.fillStyle="#7a5230";ctx.fillRect(h.x-12,h.y-34,24,34);ctx.fillStyle="#9ad0ff";ctx.fillRect(h.x-36,h.y-46,18,16);ctx.fillRect(h.x+18,h.y-46,18,16);}
      else if(it.t==="gate"){const g=it.o,pulse=0.5+0.5*Math.sin(tnow/400);
        ctx.save();ctx.globalAlpha=0.5+0.4*pulse;ctx.strokeStyle=g.col;ctx.lineWidth=6;
        ctx.beginPath();ctx.ellipse(g.x,g.y-30,30,40,0,0,7);ctx.stroke();
        ctx.globalAlpha=0.18+0.18*pulse;ctx.fillStyle=g.col;ctx.beginPath();ctx.ellipse(g.x,g.y-30,26,36,0,0,7);ctx.fill();
        ctx.restore();
        ctx.fillStyle="#3f3320";ctx.font="700 15px "+"sans-serif";ctx.textAlign="center";ctx.fillText(g.label,g.x,g.y+18);}
      else if(it.t==="npc"){const n=it.o;
        if(n.kind==="prince"){if(prince.complete&&prince.naturalWidth){ctx.imageSmoothingEnabled=true;const w=54,h=w*(prince.naturalHeight/prince.naturalWidth);ctx.drawImage(prince,n.x-w/2,n.y-h,w,h);}}
        else if(n.kind==="sign"){ctx.fillStyle="#8a5a32";ctx.fillRect(n.x-3,n.y-28,6,28);ctx.fillStyle="#caa96a";ctx.fillRect(n.x-22,n.y-46,44,22);ctx.fillStyle="#5a4632";ctx.font="16px serif";ctx.textAlign="center";ctx.fillText("?",n.x,n.y-30);}
        else{ctx.font="40px serif";ctx.textAlign="center";ctx.fillText(n.emo,n.x,n.y);}
      }
      else if(it.t==="player"){
        const bob=moving?Math.abs(Math.sin(tnow/90))*-7:0;
        if(claude.complete&&claude.naturalWidth){ctx.imageSmoothingEnabled=false;const w=46,h=w*(claude.naturalHeight/claude.naturalWidth);
          ctx.save();ctx.translate(player.x,player.y+bob);ctx.scale(player.face,1);ctx.drawImage(claude,-w/2,-h,w,h);ctx.restore();}
        else{ctx.fillStyle="#e8945a";ctx.fillRect(player.x-16,player.y-30,32,30);}
        // 影子
        ctx.fillStyle="rgba(40,60,30,.18)";ctx.beginPath();ctx.ellipse(player.x,player.y+2,16,5,0,0,7);ctx.fill();
      }
    }

    // 对话气泡（屏幕坐标）
    ctx.restore();
    if(talk){const sx=talk.x-camX,sy=talk.y-camY-(talk.kind==="prince"?64:46);
      ctx.font="600 15px "+"'Noto Serif SC',serif";const tw=ctx.measureText(talk.line).width,pad=12,bw=tw+pad*2,bh=30;
      let bx=sx-bw/2;bx=Math.max(8,Math.min(W-bw-8,bx));let by=Math.max(60,sy-bh);
      ctx.fillStyle="rgba(40,30,20,.86)";rr(bx,by,bw,bh,12);ctx.fill();
      ctx.fillStyle="#fff6e8";ctx.textAlign="left";ctx.textBaseline="middle";ctx.fillText(talk.line,bx+pad,by+bh/2);
      ctx.textBaseline="alphabetic";}
    requestAnimationFrame(step);
  }
  function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
  requestAnimationFrame(step);
})();
</script>
</body>
</html>
